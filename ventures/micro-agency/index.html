<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RayNV Micro-Agency | Instant AI Audit</title>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: -apple-system, sans-serif; padding: 40px; max-width: 600px; margin: auto; }
        h1 { color: #38bdf8; font-size: 1.8rem; }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; background: #1e293b; border: 1px solid #334155; color: white; border-radius: 6px; box-sizing: border-box; }
        button { background: #0284c7; color: white; border: none; padding: 12px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; }
        button:hover { background: #0369a1; }
        #result { margin-top: 20px; background: #1e293b; padding: 15px; border-radius: 6px; display: none; }
    </style>
</head>
<body>
    <h1>⚡ Instant AI Code & Business Audit</h1>
    <p>Submit your project details for an automated, instant evaluation powered by RayNV architecture.</p>
    <form id="auditForm">
        <input type="text" id="name" placeholder="Your Name / Project" required>
        <input type="email" id="email" placeholder="Your Contact Email" required>
        <textarea id="details" rows="4" placeholder="Paste snippet or describe bottleneck..." required></textarea>
        <button type="submit">Run Autonomous Audit (10 671-Coins)</button>
    </form>
    <div id="result"></div>

    <script>
        document.getElementById('auditForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                item: "Instant AI Audit",
                price: "10 671-Coins",
                buyer: document.getElementById('email').value,
                details: document.getElementById('details').value
            };
            
            try {
                const res = await fetch('http://localhost:8787/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                const resultDiv = document.getElementById('result');
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = `<strong>✅ Audit Queued Successfully!</strong><br>Logged locally to RayGateway. We will dispatch your analysis shortly.`;
            } catch(err) {
                alert('Gateway offline. Ensure local daemon is running on port 8787.');
            }
        });
    </script>
</body>
</html>
