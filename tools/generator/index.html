<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>671-Coin AI Code Generator</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; max-width: 600px; margin: 40px auto; padding: 20px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { color: #38bdf8; font-size: 1.5rem; text-align: center; }
        textarea { width: 100%; height: 140px; background: #1e293b; color: #fff; border: 1px solid #334155; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 0.95rem; box-sizing: border-box; resize: vertical; margin-bottom: 15px; }
        button { background: #0ea5e9; color: white; border: none; padding: 12px 20px; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; transition: background 0.2s; }
        button:hover { background: #0284c7; }
        #output { margin-top: 20px; background: #1e293b; padding: 15px; border-radius: 8px; border: 1px solid #334155; white-space: pre-wrap; display: none; font-family: monospace; font-size: 0.9rem; }
    </style>
</head>
<body>
    <h1>⚡ AI Code Generator</h1>
    <p style="text-align: center; color: #94a3b8; font-size: 0.9rem;">Generate clean, production-ready Python automation scripts instantly.</p>
    
    <label for="codeInput">Script Specification:</label>
    <textarea id="codeInput" placeholder="Describe the script or utility you want to generate..."></textarea>
    
    <button onclick="generateCode()">Generate & Process (Price: 671 Coins)</button>
    
    <div id="output"></div>

    <script>
        async function generateCode() {
            const raw = document.getElementById('codeInput').value;
            if(!raw) { alert('Please enter script specifications first.'); return; }

            const payload = {
                item: "AI Code Generator Pass",
                price: "671 Coins",
                customer: "generator_client@ray.services",
                input_data: raw
            };

            try {
                const res = await fetch('http://localhost:8787/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                
                if(data.status === 'success') {
                    const out = document.getElementById('output');
                    out.style.display = 'block';
                    out.innerHTML = `<strong>✅ Payment Confirmed (${data.logged.price})!</strong><br><br><strong>Generated Code Output:</strong><br><code># RayNV Automated Script<br>import os<br>print("Executing task for: ${raw}")</code>`;
                } else {
                    alert('Gateway transaction failed.');
                }
            } catch (err) {
                alert('Could not connect to RayGateway on port 8787.');
            }
        }
    </script>
</body>
</html>
