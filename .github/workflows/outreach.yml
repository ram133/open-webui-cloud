# https://github.com/ram133/open-webui-cloud
name: Autonomous Guam Outreach

on:
  schedule:
    - cron: '0 */4 * * *' # Runs every 4 hours automatically
  workflow_dispatch:

jobs:
  outreach:
    runs-on: macos-latest # Uses macOS runner so osascript/iMessage hooks or simulated cloud APIs execute smoothly
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Guam Airdrop & Outreach Batch
        run: |
          python3 guam_airdrop.py
          python3 batch_imessage.py

      - name: Commit Updated Ledger State
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Autonomous Cloud Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add guam_coins.json
          git commit -m "Autonomous cloud ledger state update after outreach batch [skip ci]" || echo "No changes to commit"
          git push
